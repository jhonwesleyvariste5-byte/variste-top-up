<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Variste Top Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f8;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 18px;
      color: #111827;
      font-size: 21px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .game {
      border: 2px solid #e5e7eb;
      padding: 14px 5px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      background: white;
      font-weight: bold;
    }

    .game:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .game.selected {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .package {
      border: 2px solid #e5e7eb;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }

    .package:hover {
      border-color: #2563eb;
    }

    .package.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .package strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .price {
      color: #16a34a;
      font-weight: bold;
    }

    .payment {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .payment strong {
      color: #92400e;
    }

    .summary {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.8;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .whatsapp:hover {
      background: #1ebe5d;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #6b7280;
      font-size: 14px;
    }

    .notice {
      background: #fee2e2;
      border: 1px solid #ef4444;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 27px;
      }

      .games {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
