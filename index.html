<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variste Top-Up</title>

*{box-sizing:border-box;margin:0;padding:0}
body{

z-index:5;
}
.logo{

color:#e50914;
}
.menu{
font-size:28px;
cursor:pointer;
}
.search{

}

border-radius:12px 0 0 12px;

outline:none;
}
.search button{

}
.banner{
margin:15px;
padding:30px 20px;
border-radius:18px;
background:linear-gradient(135deg,#111,#d60000);
color:#fff;
}
.banner h1{
font-size:27px;
margin-bottom:10px;
}
.banner p{
font-size:15px;
line-height:1.5;
}
.container{
padding:0 15px 25px;
}
.title{
font-size:21px;

}
.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:5px;
}
.categories button{
border:1px solid #ddd;
background:#fff;

border-radius:25px;
white-space:nowrap;
}
.categories .active{
background:#e50914;
color:white;

}
.products{
display:grid;
grid-template-columns:repeat(2,1fr);

}
.card{
background:#fff;
border-radius:15px;
padding:12px;

}
.card-img{
height:125px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
background:#eee;
}
.card h3{
font-size:15px;
margin:10px 0 5px;
}
.price{
font-weight:bold;
color:#e50914;
margin-bottom:10px;
}
.card button{
width:100%;
padding:11px;
border:0;
border-radius:9px;
background:#e50914;
color:white;
font-weight:bold;
}
.features{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
